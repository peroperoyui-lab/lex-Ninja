<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080e1c"><meta name="description" content="蕾忍宗·宗门大比：本地双人格斗、原声忍术与三格怒气奥义。"><title>蕾忍宗 · 宗门大比</title><link rel="icon" href="data:,"><link rel="stylesheet" href="style.css"></head>
<body>
<main id="stage" aria-label="蕾忍宗格斗游戏">
 <canvas id="arena" width="1280" height="720" aria-label="半身黄脸忍者的对战舞台"></canvas>
 <div class="wordmark"><span class="seal">忍</span><b>蕾忍宗</b><i>LEX NINJA</i></div>
 <nav class="tools" aria-label="游戏控制"><button id="pauseBtn" class="hidden" title="暂停 / Esc">Ⅱ <span>暂停</span></button><button id="settingsBtn" title="音量与设置">◒ <span>设置</span></button><button id="fullBtn" title="全屏">⛶ <span>全屏</span></button></nav>
 <section id="menu" class="view">
  <div class="menu-content"><div class="eyebrow">忍 术 无 眼 · 先 握 为 敬</div><h1>宗门大比<span>忍术对决</span></h1><div class="red-stamp">蕾忍</div>
   <div class="menu-actions"><button id="startBtn" class="main-action"><small>01</small>开始对决<b>↗</b></button><button id="tutorialBtn"><small>02</small>新手修炼<b>→</b></button><button id="bookBtn"><small>03</small>招式卷轴<b>→</b></button><button id="soundBtn"><small>04</small>原声大碟<b id="audioCount">81</b></button></div>
  </div>
  <div class="menu-foot"><span>非官方同人 · 键盘双人</span><span>第二卷 / 0.2</span></div>
 </section>
 <section id="guide" class="hidden" aria-live="polite"><div class="guide-top"><span id="lessonCount">01 / 06</span><button id="skipLesson">跳过此步 →</button></div><strong id="lessonTitle">先动起来</strong><div id="lessonKeys">A D + W</div><p id="lessonHint">左右移动，再跳一下。</p><div id="lessonDots"></div></section>
 <div id="toast" class="hidden" role="status"></div>
 <section id="paused" class="view modal-view hidden" aria-label="暂停菜单"><div class="pause-card"><div class="eyebrow">PAUSED</div><h2>暂且收手</h2><button id="resumeBtn" class="primary">继续切磋 <span>→</span></button><div class="pause-volume"><label for="pauseVolume">总音量</label><input id="pauseVolume" type="range" min="0" max="1" step=".01" value=".65"><output id="pauseVolumeValue">65%</output></div><div class="pause-links"><button id="restartBtn">重新开局</button><button id="pauseBookBtn">查招式</button><button id="pauseMenuBtn">返回宗门</button></div></div></section>
 <section id="result" class="view modal-view hidden"><div class="result-card"><div class="eyebrow" id="resultEyebrow">VICTORY</div><h2 id="resultTitle">壹号忍者胜</h2><p id="resultStats"></p><button id="rematchBtn" class="primary">再战一场 <span>→</span></button><button id="resultMenuBtn" class="quiet">返回宗门</button></div></section>
 <div id="loading" class="view modal-view hidden"><div class="loading-card"><span class="seal">忍</span><p id="loadStatus">忍术就位…</p><div class="load-track"><div id="loadProgress"></div></div></div></div>
 <dialog id="setup"><div class="dialog-title"><div><small>VERSUS</small><h2>对战准备</h2></div><button data-close="setup" aria-label="关闭对战准备">×</button></div><div class="mode-tabs"><button data-mode="solo" class="active">人机切磋</button><button data-mode="versus">本地双人</button><button data-mode="watch">观战</button></div><div class="seats"><label><b>壹 / PLAYER 1</b><select id="p1mode" aria-label="玩家一"><option value="human">玩家</option><option value="ai">AI</option></select><span>WASD · JKL / UIO</span></label><em>VS</em><label><b>贰 / PLAYER 2</b><select id="p2mode" aria-label="玩家二"><option value="ai">AI</option><option value="human">玩家</option><option value="dummy">训练木桩</option></select><span>方向键 · 小键盘 1–6</span></label></div><button id="fightBtn" class="primary">开 战 <span>→</span></button><p class="tiny">三局两胜</p></dialog>
 <dialog id="settings"><div class="dialog-title"><div><small>OPTIONS</small><h2>声音与画面</h2></div><button data-close="settings" aria-label="关闭设置">×</button></div><div class="sliders"><label>总音量<input id="masterVolume" type="range" min="0" max="1" step=".01" value=".65"><output id="masterValue">65%</output></label><label>忍术原声<input id="voiceVolume" type="range" min="0" max="1" step=".01" value=".9"><output id="voiceValue">90%</output></label><label>打击音效<input id="sfxVolume" type="range" min="0" max="1" step=".01" value=".7"><output id="sfxValue">70%</output></label></div><div class="option-row"><label><input id="mute" type="checkbox"> 静音 <kbd>M</kbd></label><button id="testAudio" class="quiet">试听</button></div><label class="option-row"><span>减少闪光与震动</span><input id="reduced" type="checkbox"></label></dialog>
 <dialog id="book" class="wide"><div class="dialog-title"><div><small>MOVE LIST</small><h2>忍术卷轴</h2></div><button data-close="book" aria-label="关闭招式卷轴">×</button></div><div class="mode-tabs"><button data-book="0" class="active">壹 · 字母键</button><button data-book="1">贰 · 小键盘</button></div><div class="basics" id="basicKeys"></div><div id="moveList" class="move-list"></div><p class="tiny">→ 为面向对手的方向；方向依次输入，＋ 表示同时按。</p></dialog>
 <dialog id="sounds" class="wide"><div class="dialog-title"><div><small>SOUND BANK</small><h2>原声大碟</h2></div><button data-close="sounds" aria-label="关闭原声大碟">×</button></div><div class="sound-tools"><input id="soundSearch" placeholder="搜一个忍术…" aria-label="搜索忍术"><button id="importBtn">导入音频</button></div><p id="importStatus" class="tiny">点击试听原声</p><div id="soundList" class="sound-list"></div></dialog>
 <input id="audioFiles" type="file" accept=".zip,.wav,.mp3,.ogg,.m4a" multiple hidden>
</main>
<script src="assets/audio-data.js"></script><script src="src/combat.js"></script><script src="src/audio.js"></script><script src="src/render.js"></script><script src="src/game.js"></script>
</body></html>
